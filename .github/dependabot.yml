version: 2

# Routine version updates run together weekly. Major updates remain separate,
# and security updates remain on Dependabot's immediate security-update path.
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    groups:
      apps-web-routine:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
